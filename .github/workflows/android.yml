name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare stable signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.LEDSTUDIO_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::The stable LED Studio signing key is not configured"
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ledstudio-signing.p12"

      - name: Build debug APK
        env:
          LEDSTUDIO_KEYSTORE_PATH: ${{ runner.temp }}/ledstudio-signing.p12
          LEDSTUDIO_SIGNING_PASSWORD: ${{ secrets.LEDSTUDIO_SIGNING_PASSWORD }}
          LEDSTUDIO_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug --console=plain --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LedStudio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
